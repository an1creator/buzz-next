name: Buzz Next runtime
on:
  push:
    branches: [next, feature/autonomous-agents]
    paths:
      - .github/workflows/buzz-next-runtime.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buzz-next-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    if: github.repository == 'an1creator/buzz-next'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - name: Test native provider and host
        run: cargo test --locked -p buzz-backend-ssh -p buzz-workspaces
      - name: Test full ACP package
        run: |
          git --version
          cargo test --locked -p buzz-acp -- --test-threads=1
      - name: Build runtime
        run: cargo build --locked --release -p buzz-backend-ssh -p buzz-acp -p buzz-cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/bin package/codex-acp package/systemd
          cp target/release/{buzz-host,buzz-codex-agent,buzz-acp,buzz,buzz-backend-ssh} package/bin/
          cp crates/buzz-backend-ssh/codex-acp/package*.json package/codex-acp/
          npm ci --prefix package/codex-acp --omit=optional --ignore-scripts
          cp crates/buzz-backend-ssh/assets/buzz-next-agent@.service package/systemd/
          printf '%s\n' "$GITHUB_SHA" > package/SOURCE_COMMIT
          target/release/buzz-acp --help > /dev/null
          target/release/buzz --help > /dev/null
          target/release/buzz-host info
          tar -czf "buzz-next-runtime-linux-x64-${GITHUB_SHA}.tar.gz" -C package .
          sha256sum buzz-next-runtime-linux-x64-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buzz-next-runtime-linux-x64-${{ github.sha }}
          path: |
            buzz-next-runtime-linux-x64-*.tar.gz
            SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  windows-provider:
    if: github.repository == 'an1creator/buzz-next'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - name: Test and build Windows provider
        shell: bash
        run: |
          cargo test --locked -p buzz-backend-ssh
          cargo build --locked --release -p buzz-backend-ssh --bin buzz-backend-ssh
          printf '{"op":"info"}' | target/release/buzz-backend-ssh.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buzz-next-provider-windows-x64-${{ github.sha }}
          path: target/release/buzz-backend-ssh.exe
          retention-days: 7
          if-no-files-found: error
