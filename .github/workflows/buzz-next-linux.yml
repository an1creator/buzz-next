name: Buzz Next Linux AppImage

on:
  push:
    branches: [feature/linux-appimage]
    paths: ['.github/workflows/buzz-next-linux.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Buzz Next version (X.Y.Z or X.Y.Z-next.N)'
        required: true
        default: '0.5.25-next.5'
        type: string

permissions:
  contents: read

concurrency:
  group: buzz-next-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    if: github.repository == 'an1creator/buzz-next'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TARGET: x86_64-unknown-linux-gnu
      VERSION: ${{ inputs.version || '0.5.25-next.5' }}
      CARGO_BUILD_JOBS: 2
      APPIMAGE_EXTRACT_AND_RUN: '1'
      BUZZ_UPDATER_ENDPOINT: https://buzz.n1creator.com/updates/linux/latest.json
      BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential desktop-file-utils file libasound2-dev \
            libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf \
            pkg-config squashfs-tools wget xdg-utils
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: linux-appimage
          workspaces: |
            .
            desktop/src-tauri
      - name: Install pinned AppImage tooling
        run: |
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool' | sha256sum -c
          sudo install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime' | sha256sum -c
          sudo install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo 'APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime' >> "$GITHUB_ENV"
      - name: Configure Buzz Next and test Linux release overlay
        run: |
          set -euo pipefail
          just desktop-install-ci
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          node scripts/build-release-config.mjs
          node scripts/build-next-linux-config.mjs
          node --test scripts/build-next-linux-config.test.mjs
          pnpm typecheck
          cd src-tauri
          cargo update --workspace
      - name: Build Linux sidecars and SSH prompt helper
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" \
            -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes \
            -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          cargo build --locked --release --target "$TARGET" \
            -p buzz-connections --bin buzz-ssh-askpass
          scripts/bundle-sidecars.sh "$TARGET"
          install -m 755 "target/$TARGET/release/buzz-ssh-askpass" \
            "desktop/src-tauri/binaries/buzz-ssh-askpass-$TARGET"
      - name: Build signed AppImage
        run: |
          cd desktop
          pnpm tauri build --ci --target "$TARGET" --bundles appimage \
            --features mesh-llm --config src-tauri/tauri.next.linux.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Apply upstream AppImage compatibility fix and re-sign
        run: |
          set -euo pipefail
          mapfile -t images < <(find "desktop/src-tauri/target/$TARGET/release/bundle/appimage" \
            -maxdepth 1 -name '*.AppImage' -type f)
          if [[ ${#images[@]} -ne 1 ]]; then
            echo "Expected one AppImage, found ${#images[@]}" >&2
            exit 1
          fi
          bash desktop/scripts/fix-appimage.sh "${images[0]}"
          test -s "${images[0]}.sig"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Record candidate
        run: |
          set -euo pipefail
          mkdir candidate
          cp "desktop/src-tauri/target/$TARGET/release/bundle/appimage/"*.AppImage candidate/
          cp "desktop/src-tauri/target/$TARGET/release/bundle/appimage/"*.AppImage.sig candidate/
          printf '%s\n' "$GITHUB_SHA" > candidate/SOURCE_COMMIT
          printf '%s\n' "$VERSION" > candidate/VERSION
          cd candidate
          sha256sum *.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buzz-next-linux-${{ github.sha }}
          path: candidate/
          retention-days: 7
          if-no-files-found: error
