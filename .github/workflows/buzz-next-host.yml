name: Connections host candidate
on:
  workflow_dispatch:
  push:
    branches: [feature/ssh-connections]
permissions:
  contents: read
concurrency:
  group: connections-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev pkg-config cmake libopus-dev openssh-server
          sudo mkdir -p /run/sshd
      - name: Full host and ACP suites
        run: |
          cargo test --locked -p buzz-connections -p buzz-remote-host -p buzz-acp
          cargo clippy --locked -p buzz-connections -p buzz-remote-host --all-targets -- -D warnings
          cargo fmt -p buzz-connections -p buzz-remote-host -- --check
      - name: Build bundle
        run: |
          cargo build --locked --release -p buzz-remote-host -p buzz-acp -p buzz-cli -p buzz-dev-mcp
          mkdir candidate
          cp target/release/buzz-host target/release/buzz-acp target/release/buzz target/release/buzz-dev-mcp candidate/
          cp crates/buzz-remote-host/README.md candidate/README.md
          printf '%s\n' "$GITHUB_SHA" > candidate/SOURCE_COMMIT
          printf '%s\n' '{"host_protocol":1,"platform":"linux-x86_64","entrypoint":"buzz-connections-host"}' > candidate/COMPATIBILITY.json
          cd candidate
          sha256sum buzz-host buzz-acp buzz buzz-dev-mcp README.md SOURCE_COMMIT COMPATIBILITY.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: connections-host-${{ github.sha }}
          path: candidate/
          retention-days: 7
          if-no-files-found: error
