name: Connections full repository gate
on:
  workflow_dispatch:
  push:
    branches: [feature/ssh-connections]
    paths: ['.github/workflows/buzz-next-full-check.yml']
permissions:
  contents: read
concurrency:
  group: connections-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential curl file libasound2-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config cmake libopus-dev
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            .
            desktop/src-tauri
      - name: Prepare packages
        run: |
          pnpm install --frozen-lockfile
          just mobile-install
      - name: Complete repository gate
        run: |
          set -o pipefail
          git rev-parse HEAD > full-gate.log
          just ci 2>&1 | tee -a full-gate.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: connections-full-gate-${{ github.sha }}
          path: full-gate.log
          retention-days: 7
