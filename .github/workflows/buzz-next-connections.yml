name: Connections platform gates
on:
  workflow_dispatch:
  push:
    branches: [feature/ssh-connections]
    paths:
      - 'crates/buzz-connections/**'
      - 'crates/buzz-remote-host/**'
      - 'desktop/**'
      - '.github/workflows/buzz-next-connections.yml'
      - 'Cargo.lock'
permissions:
  contents: read
concurrency:
  group: connections-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Whole connection package
        run: cargo +stable test --locked -p buzz-connections
      - name: Lint
        run: cargo +stable clippy --locked -p buzz-connections --all-targets -- -D warnings
      - name: Formatting
        run: cargo +stable fmt -p buzz-connections -- --check
      - name: Windows OpenSSH authentication integration
        if: runner.os == 'Windows'
        run: |
          python -m pip install paramiko==4.0.0
          cargo +stable test --locked -p buzz-connections -- --include-ignored
      - name: Host package checks
        if: runner.os == 'Linux'
        run: |
          cargo +stable test --locked -p buzz-remote-host
          cargo +stable clippy --locked -p buzz-remote-host --all-targets -- -D warnings
      - name: Isolated OpenSSH integration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          cargo +stable test --locked -p buzz-connections -- --include-ignored

  desktop-windows:
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - name: Frontend full checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          cd desktop
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Unit-test sidecar placeholders (not a distributable build)
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(rustc -vV | sed -n 's|host: ||p')
          mkdir -p desktop/src-tauri/binaries
          for bin in buzz-acp buzz-agent buzz-dev-mcp git-credential-nostr buzz; do
            touch "desktop/src-tauri/binaries/${bin}-${TARGET}.exe"
          done
      - name: Complete Desktop Rust package
        shell: bash
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --workspace
