name: Buzz Next relay

on:
  push:
    branches: [next, feature/relay-release]
    paths:
      - Dockerfile
      - .github/workflows/buzz-next-relay.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - migrations/**
      - web/**
      - admin-web/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buzz-next-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'an1creator/buzz-next'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/an1creator/buzz-next-relay
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Reclaim unused runner SDK space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            CARGO_BUILD_JOBS=2
            BUZZ_REPOSITORY=https://github.com/an1creator/buzz-next
            BUZZ_SOURCE_SHA=${{ github.sha }}
            BUZZ_BUILD_ID=${{ github.run_id }}
            BUZZ_BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/an1creator/buzz-next
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/an1creator/buzz-next-relay:buildcache
          cache-to: type=registry,ref=ghcr.io/an1creator/buzz-next-relay:buildcache,mode=max
      - name: Verify runtime binaries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec \
            'test -x /usr/local/bin/buzz-relay; output=$(ldd /usr/local/bin/buzz-relay); printf "%s\n" "$output"; ! printf "%s\n" "$output" | grep -q "not found"'
          docker run --rm --entrypoint /usr/local/bin/buzz-admin "$IMAGE@$DIGEST" --help
      - name: Record candidate identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n --arg source "$GITHUB_SHA" --arg image "$IMAGE@$DIGEST" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source_commit:$source, relay_image:$image, build_run:$run, status:"candidate", deployed:false}' \
            > relay-candidate.json
          cat relay-candidate.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-candidate
          path: relay-candidate.json
          retention-days: 7
